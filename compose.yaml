services:
  replica-a:
    image: kubeai:local
    command: [emulator, --host, 0.0.0.0, --port, "8000", --capacity, "2", --token-seconds, "0.004"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  replica-b:
    image: kubeai:local
    command: [emulator, --host, 0.0.0.0, --port, "8000", --capacity, "2", --token-seconds, "0.001"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  router:
    image: kubeai:local
    build: .
    ports: ["127.0.0.1:8080:8080"]
    command: [router, --host, 0.0.0.0, --config, config/docker.json]
    volumes:
      - ./config:/app/config:ro
      - ./results:/app/results:ro
    depends_on:
      replica-a: {condition: service_healthy}
      replica-b: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    ports: ["127.0.0.1:9090:9090"]
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes:
      - ./monitoring/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
volumes:
  prometheus-data:
