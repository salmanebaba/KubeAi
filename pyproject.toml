[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeai-prototype"
version = "0.1.0"
description = "Measurable inference routing and GPU placement research prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kubeai = "kubeai.__main__:main"

[tool.setuptools.package-data]
kubeai = ["static/*"]

[tool.setuptools.packages.find]
include = ["kubeai*"]
