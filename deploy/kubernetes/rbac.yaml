apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeai-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeai-discovery
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeai-discovery
subjects:
  - kind: ServiceAccount
    name: kubeai-router
    namespace: kubeai
roleRef:
  kind: Role
  name: kubeai-discovery
  apiGroup: rbac.authorization.k8s.io
