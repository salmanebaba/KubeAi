apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeai-emulator
spec:
  replicas: 2
  selector:
    matchLabels: {app: kubeai-backend}
  template:
    metadata:
      labels: {app: kubeai-backend}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: emulator
          image: kubeai:local
          imagePullPolicy: IfNotPresent
          args: [emulator, --host, 0.0.0.0, --port, "8000", --capacity, "2"]
          ports: [{name: http, containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: kubeai-backends
spec:
  selector: {app: kubeai-backend}
  ports: [{name: http, port: 8000, targetPort: http}]
