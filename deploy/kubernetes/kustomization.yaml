apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeai
resources:
  - namespace.yaml
  - rbac.yaml
  - replicas.yaml
  - router.yaml
  - prometheus.yaml
configMapGenerator:
  - name: kubeai-config
    files:
      - router.json
  - name: kubeai-prometheus
    files:
      - prometheus.yml
generatorOptions:
  disableNameSuffixHash: true
