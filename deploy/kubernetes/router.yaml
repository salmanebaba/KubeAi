apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeai-router
spec:
  replicas: 1
  selector:
    matchLabels: {app: kubeai-router}
  template:
    metadata:
      labels: {app: kubeai-router}
    spec:
      serviceAccountName: kubeai-router
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: router
          image: kubeai:local
          imagePullPolicy: IfNotPresent
          args: [router, --host, 0.0.0.0, --config, /etc/kubeai/router.json]
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          volumeMounts: [{name: config, mountPath: /etc/kubeai, readOnly: true}]
      volumes: [{name: config, configMap: {name: kubeai-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: kubeai-router
spec:
  selector: {app: kubeai-router}
  ports: [{name: http, port: 8080, targetPort: http}]
