global:
  scrape_interval: 2s
  scrape_timeout: 1s
storage:
  tsdb:
    retention:
      time: 2d
      size: 512MB
scrape_configs:
  - job_name: kubeai
    static_configs:
      - targets: [router:8080]
  - job_name: vllm-emulator
    static_configs:
      - targets: [replica-a:8000, replica-b:8000]
