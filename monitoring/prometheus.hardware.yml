global:
  scrape_interval: 2s
  scrape_timeout: 1s
storage:
  tsdb:
    retention:
      time: 2d
      size: 512MB
scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["127.0.0.1:8000"]
  - job_name: kubeai
    static_configs:
      - targets: ["127.0.0.1:8080"]
  - job_name: gpu
    static_configs:
      - targets: ["127.0.0.1:9401"]
